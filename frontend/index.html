<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Job Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            HireHub
        </a>

        <div>
            <a href="login.html" class="btn btn-light me-2">
                Login
            </a>

            <a href="register.html" class="btn btn-outline-light">
                Register
            </a>
        </div>

    </div>
</nav>


<div class="container mt-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Find Your Next Opportunity
        </h1>

        <p class="text-muted">
            Connect job seekers with recruiters through HireHub.
        </p>

    </div>


    <div class="row mb-4">

        <div class="col-md-8">
            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search jobs..."
            >
        </div>

        <div class="col-md-4">
            <button
                class="btn btn-primary w-100"
                onclick="loadJobs()"
            >
                Search Jobs
            </button>
        </div>

    </div>


    <div id="jobsContainer" class="row">

        <div class="text-center">
            Loading jobs...
        </div>

    </div>

</div>


<script src="app.js"></script>

</body>
</html>
