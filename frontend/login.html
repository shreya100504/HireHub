<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HireHub - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>HireHub</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>
    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Login</h1>

            <p>Login to your HireHub account</p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>


            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </main>


    <!-- IMPORTANT: Load JavaScript -->
    <script src="app.js"></script>

</body>

</html>
